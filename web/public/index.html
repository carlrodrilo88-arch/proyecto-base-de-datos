<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meditec Reportes</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section id="loginView" class="login">
        <div class="brand">
          <span class="mark">M</span>
          <div>
            <h1>Meditec Reportes</h1>
            <p>Acceso al sistema documental</p>
          </div>
        </div>
        <form id="loginForm" class="panel">
          <label>
            Correo
            <input name="correo" type="email" value="admin@meditec.local" required>
          </label>
          <label>
            Contrasena
            <input name="password" type="password" value="admin123" required>
          </label>
          <button type="submit">Ingresar</button>
          <p id="loginMessage" class="message"></p>
        </form>
      </section>

      <section id="appView" class="app hidden">
        <aside class="sidebar">
          <div class="brand compact">
            <span class="mark">M</span>
            <div>
              <h1>Meditec</h1>
              <p id="userLabel"></p>
            </div>
          </div>
          <nav>
            <button class="nav-button active" data-module="servicios">Servicios solicitantes</button>
            <button class="nav-button" data-module="tecnicos">Tecnicos</button>
            <button class="nav-button" data-module="instituciones">Instituciones</button>
            <button class="nav-button" data-module="proveedores">Proveedores</button>
            <button class="nav-button" data-module="equipos_medicos">Equipos medicos</button>
            <button class="nav-button" data-module="reportes">Reportes</button>
            <button id="usersNav" class="nav-button hidden" data-module="usuarios">Usuarios</button>
            <button class="nav-button" data-module="password">Cambiar mi contrasena</button>
          </nav>
          <button id="logoutButton" class="secondary">Salir</button>
        </aside>

        <section class="content">
          <header>
            <div>
              <h2 id="moduleTitle">Servicios solicitantes</h2>
              <p id="moduleSubtitle">CRUD conectado a PostgreSQL</p>
            </div>
          </header>

          <div id="catalogPanel">
            <form id="recordForm" class="toolbar">
              <input type="hidden" name="id">
              <input name="nombre" placeholder="Nombre" required>
              <input name="telefono" placeholder="Telefono">
              <input name="correo" placeholder="Correo">
              <input name="extra" placeholder="Direccion">
              <select name="id_institucion" class="hidden"></select>
              <input name="logo_url" class="hidden" placeholder="Ruta o URL del logotipo">
              <input name="pie_pagina" class="hidden" placeholder="Texto del pie de pagina">
              <input name="numero_bien" class="hidden" placeholder="Numero de bien">
              <input name="marca" class="hidden" placeholder="Marca">
              <input name="modelo" class="hidden" placeholder="Modelo">
              <input name="numero_serie" class="hidden" placeholder="Numero de serie">
              <select name="id_rol" class="hidden"></select>
              <input name="password_temporal" type="password" class="hidden" placeholder="Contrasena temporal">
              <label class="check">
                <input name="activo" type="checkbox" checked>
                Activo
              </label>
              <button type="submit">Guardar</button>
              <button type="button" id="clearButton" class="secondary">Nuevo</button>
            </form>

            <div class="table-wrap">
              <table>
                <thead><tr id="tableHead"></tr></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>

          <div id="reportsPanel" class="hidden">
            <form id="reportForm" class="report-form panel">
              <input name="titulo" placeholder="Titulo del reporte" required>
              <input name="fecha_reporte" type="date" required>
              <select name="id_servicio_solicitante" required></select>
              <div class="equipment-picker">
                <input id="equipmentSearch" type="search"
                  placeholder="Buscar por equipo, numero de bien o serie" autocomplete="off">
                <div id="equipmentSuggestions" class="equipment-suggestions hidden"></div>
                <div id="selectedEquipmentList" class="selected-equipment-list"></div>
              </div>
              <select name="id_proveedor_plantilla" required></select>
              <input name="numero_pedido_nog" placeholder="Numero de pedido y NOG">
              <select name="tipo_servicio" required>
                <option value="">Seleccione tipo de servicio</option>
                <option value="garantia">Garantia</option>
                <option value="preventivo">Mantenimiento preventivo</option>
                <option value="correctivo">Mantenimiento correctivo</option>
                <option value="emergencia">Llamada de emergencia</option>
                <option value="otros">Otros</option>
              </select>
              <textarea name="especificaciones_tecnicas" placeholder="Especificaciones tecnicas" required></textarea>
              <textarea name="recomendaciones" placeholder="Recomendaciones"></textarea>
              <textarea name="descripcion" placeholder="Descripcion u observaciones generales"></textarea>
              <button type="submit">Guardar borrador y ver</button>
            </form>
            <form id="reportFilterForm" class="filters">
              <input name="codigo" placeholder="Buscar por codigo">
              <select name="estado">
                <option value="">Todos los estados</option>
                <option value="borrador">Borrador</option>
                <option value="publicado">Publicado</option>
                <option value="anulado">Anulado</option>
              </select>
              <button type="submit">Buscar</button>
            </form>
            <div class="table-wrap">
              <table>
                <thead><tr id="reportTableHead"></tr></thead>
                <tbody id="reportTableBody"></tbody>
              </table>
            </div>
          </div>
          <div id="passwordPanel" class="hidden">
            <form id="passwordForm" class="panel password-form">
              <p id="passwordNotice">Actualice su contrasena personal.</p>
              <label>Contrasena actual
                <input name="password_actual" type="password" autocomplete="current-password" required>
              </label>
              <label>Nueva contrasena
                <input name="password_nueva" type="password" minlength="10" autocomplete="new-password" required>
              </label>
              <label>Confirmar nueva contrasena
                <input name="password_confirmacion" type="password" minlength="10" autocomplete="new-password" required>
              </label>
              <button type="submit">Guardar nueva contrasena</button>
            </form>
          </div>
          <p id="appMessage" class="message"></p>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
